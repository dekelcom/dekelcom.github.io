<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4d3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>הבית שלנו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1ee; --panel:#f8faf8; --card:#ffffff; --ink:#1d2b26; --muted:#6b7a74; --line:#dfe6e2;
  --accent:#1f4d3f; --accent-2:#2f6b57; --accent-soft:#e2ede8; --star:#f2b632; --danger:#c0473b;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 6px 24px rgba(20,40,30,.06);
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Heebo",system-ui,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.serif{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:500;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--panel);border-inline-end:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:44px;height:44px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:#fff}
.brand small{display:block;font-size:11px;letter-spacing:.12em;color:var(--muted)}
.brand h1{font-size:22px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav .lbl,.side .lbl{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:6px 10px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;text-align:start;font-size:16px}
.nav button:hover{background:var(--accent-soft)}
.nav button.on{background:var(--accent);color:#fff}
.nav svg{width:20px;height:20px;flex:none}
.people{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.person{display:flex;align-items:center;gap:10px;padding:4px 10px;font-size:14px}
.av{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.side .settings{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;color:var(--muted)}
.side .settings:hover{background:var(--accent-soft)}
/* main */
main{padding:22px 32px 60px;min-width:0}
.top{display:flex;justify-content:flex-end;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;display:flex;gap:8px;align-items:center;font-size:14px;box-shadow:var(--shadow)}
.dots{display:flex}
.dots .av{width:30px;height:30px;border-radius:50%;border:2px solid var(--bg);margin-inline-start:-8px;font-size:12px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.head h2{font-size:clamp(30px,4vw,44px)}
.head p{color:var(--muted);margin:6px 0 0}
.btn{background:var(--accent);color:#fff;padding:11px 18px;border-radius:12px;font-weight:500;display:inline-flex;gap:8px;align-items:center}
.btn:hover{background:var(--accent-2)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid #efcfcb}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1.4fr 1fr}
.g3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card h3{font-size:22px;margin-bottom:12px}
.muted{color:var(--muted)}
.empty{color:var(--muted);padding:14px 0;font-size:15px}
/* hero */
.hero{background:linear-gradient(135deg,#1f4d3f,#2f6b57);color:#fff;border:0}
.hero .eyebrow{color:#cfe3da}
.clock{font-family:"Frank Ruhl Libre",serif;font-size:64px;line-height:1;direction:ltr;text-align:right}
.hero .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hero .pill{background:rgba(255,255,255,.14);border-radius:999px;padding:6px 12px;font-size:14px;display:flex;gap:6px;align-items:center}
/* timeline */
.tl{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:62px 4px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .t{font-size:14px;color:var(--muted);direction:ltr;text-align:right}
.ev .bar{height:38px;border-radius:4px}
.ev .k{font-size:11px;letter-spacing:.1em;color:var(--muted)}
.ev .n{font-weight:500}
.ev.click{cursor:pointer}
.ev.click:hover .n{text-decoration:underline}
/* checklist */
.chk{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:start}
.chk:last-child{border-bottom:0}
.box{width:26px;height:26px;border-radius:8px;border:2px solid #c9d4cf;display:grid;place-items:center;flex:none;transition:.15s}
.chk.done .box{background:var(--accent);border-color:var(--accent);color:#fff}
.chk.done .txt{color:var(--muted);text-decoration:line-through}
.chk .txt{flex:1}
.chk .sub{font-size:13px;color:var(--muted)}
.x{color:var(--muted);padding:4px 8px;border-radius:8px;font-size:18px;line-height:1}
.x:hover{background:#f3e3e1;color:var(--danger)}
/* calendar */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:16px}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.day small{display:block;font-size:12px;color:var(--muted)}
.day b{font-size:22px;font-family:"Frank Ruhl Libre",serif;font-weight:500}
.day.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.day.on small{color:#cfe3da}
.day .pip{display:flex;gap:3px;justify-content:center;margin-top:4px;height:6px}
.day .pip i{width:6px;height:6px;border-radius:50%}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.f{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;display:flex;gap:6px;align-items:center}
.f.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.f i{width:9px;height:9px;border-radius:50%}
.navw{display:flex;gap:8px;align-items:center}
/* routines */
.rt-h{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.streak{margin-inline-start:auto;font-size:13px;background:#fff4e0;color:#a26a00;padding:4px 10px;border-radius:999px}
/* rewards */
.stars{display:flex;align-items:center;gap:18px}
.stars .big{font-size:60px;font-family:"Frank Ruhl Libre",serif;line-height:1}
.star{color:var(--star)}
.reward{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.reward:last-child{border-bottom:0}
.reward .cost{margin-inline-start:auto;display:flex;align-items:center;gap:4px;font-weight:700}
/* meals */
.meal{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.meal input{border:1px solid transparent;background:transparent;padding:8px 10px;border-radius:10px;width:100%}
.meal input:hover,.meal input:focus{border-color:var(--line);background:var(--panel);outline:none}
.meal.today b{color:var(--accent)}
/* forms */
.add{display:flex;gap:8px;margin-top:10px}
.in{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:11px 14px;width:100%;min-width:0}
.in:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
label.fl{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.form{display:grid;gap:14px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:14px;display:flex;gap:6px;align-items:center}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,35,30,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:50;backdrop-filter:blur(3px)}
.modal.open{display:flex}
.sheet{background:var(--card);border-radius:22px;padding:24px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.sheet h3{font-size:26px;margin-bottom:16px}
.actions{display:flex;gap:10px;justify-content:space-between;margin-top:20px}
.actions .r{display:flex;gap:10px;margin-inline-start:auto}
.mrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;margin-bottom:8px}
.colors{display:flex;gap:4px}
.colors button{width:22px;height:22px;border-radius:50%;border:2px solid transparent}
.colors button.on{border-color:var(--ink)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;transition:.3s;z-index:60;font-size:15px}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.mob-nav{display:none}
@media (orientation:portrait) and (min-width:701px){
  .app{grid-template-columns:clamp(190px,20vw,260px) 1fr}
  main{padding:clamp(20px,3vw,40px)}
  .g2{grid-template-columns:1fr}
  .g3{grid-template-columns:1fr 1fr}
  body{font-size:clamp(16px,1.6vw,22px)}
  .nav button{font-size:clamp(16px,1.7vw,22px);padding:clamp(11px,1.4vw,18px) 14px}
  .head h2{font-size:clamp(36px,5.5vw,64px)}
  .card h3{font-size:clamp(22px,2.6vw,32px)}
  .clock{font-size:clamp(64px,10vw,130px)}
  .ev{grid-template-columns:clamp(62px,8vw,90px) 4px 1fr auto}
  .box{width:clamp(26px,3vw,36px);height:clamp(26px,3vw,36px)}
  .av{width:clamp(30px,3.6vw,42px);height:clamp(30px,3.6vw,42px)}
}
@media (max-width:700px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding:16px 16px 100px}
  .g2{grid-template-columns:1fr}
  .mob-nav{display:flex;position:fixed;bottom:0;inset-inline:0;background:var(--panel);border-top:1px solid var(--line);z-index:40;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .mob-nav button{flex:1 0 64px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 4px;border-radius:10px;color:var(--muted)}
  .mob-nav button.on{color:var(--accent);background:var(--accent-soft)}
  .mob-nav svg{width:20px;height:20px}
  .clock{font-size:48px}
  .week{gap:4px}.day b{font-size:18px}
  .form .two{grid-template-columns:1fr}
  .top .chip.hide-m{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="10" width="4" height="10" rx="2"/><rect x="10" y="5" width="4" height="15" rx="2"/><rect x="16" y="12" width="4" height="8" rx="2"/></svg></div>
      <div><small>מערכת המשפחה</small><h1 id="brandName">הבית שלנו</h1></div>
    </div>
    <nav class="nav" id="nav"><div class="lbl">בית</div></nav>
    <div class="people" id="sidePeople"></div>
    <button class="settings" onclick="openSettings()">⚙️ הגדרות משפחה</button>
  </aside>
  <main>
    <div class="top">
      <div class="chip" id="weather">☀️ —</div>
      <div class="chip dots" id="topDots" onclick="openSettings()" style="cursor:pointer"></div>
    </div>
    <div id="view"></div>
  </main>
</div>
<nav class="mob-nav" id="mobNav"></nav>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- state ---------- */
const KEY='familyOS.v1';
const COLORS=['#d9534f','#2f8f5b','#3f5bd9','#e0a020','#9b4fd9','#e06b9a','#1aa3a3','#7a5a3a'];
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const DAYS_S=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function defaults(){
  const p=[{id:'p1',name:'אבא',color:COLORS[2],kid:false,stars:0},{id:'p2',name:'אמא',color:COLORS[0],kid:false,stars:0},
           {id:'p3',name:'ילד 1',color:COLORS[1],kid:true,stars:0},{id:'p4',name:'ילד 2',color:COLORS[3],kid:true,stars:0}];
  const t=dkey(addDays(new Date(),-new Date().getDay()));
  return {
    family:'הבית שלנו', city:{name:'תל אביב',lat:32.08,lon:34.78},
    people:p,
    events:[
      {id:uid(),title:'הסעה לבית הספר',date:t,time:'07:45',member:'p3',cat:'בית ספר',repeat:'weekdays'},
      {id:uid(),title:'חוג שחייה',date:t,time:'16:30',member:'p4',cat:'חוג',repeat:'weekly'},
      {id:uid(),title:'ארוחת ערב משפחתית',date:t,time:'19:00',member:'all',cat:'משפחה',repeat:'daily'}],
    routines:[
      {id:uid(),member:'p3',name:'בוקר לבית הספר',steps:['להתלבש','ארוחת בוקר','לצחצח שיניים','לארוז בקבוק מים']},
      {id:uid(),member:'p4',name:'בוקר לבית הספר',steps:['להתלבש','ארוחת בוקר','לצחצח שיניים','לנעול נעליים']},
      {id:uid(),member:'p3',name:'שגרת ערב',steps:['מקלחת','פיג׳מה','להכין תיק למחר','סיפור']}],
    routineDone:{}, streaks:{},
    jobs:[
      {id:uid(),title:'לסדר את השולחן',member:'p3',freq:'daily',stars:1},
      {id:uid(),title:'להוציא את הזבל',member:'p4',freq:'weekly',day:0,stars:2},
      {id:uid(),title:'להזמין קניות',member:'p2',freq:'weekly',day:4,stars:0}],
    jobDone:{},
    meals:{0:'',1:'',2:'',3:'',4:'',5:'',6:''},
    lists:[{id:uid(),name:'קניות',items:[{id:uid(),t:'חלב',d:false},{id:uid(),t:'לחם',d:false},{id:uid(),t:'ביצים',d:true}]},
           {id:uid(),name:'לסוף השבוע',items:[]}],
    rewards:[{id:uid(),name:'סרט בערב',cost:10},{id:uid(),name:'גלידה',cost:15},{id:uid(),name:'בחירת ארוחת שישי',cost:20}],
    log:[]
  };
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.people) S=defaults();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const person=id=>S.people.find(p=>p.id===id);
const pColor=id=>id==='all'?'#1d2b26':(person(id)?.color||'#999');
const pName=id=>id==='all'?'כולם':(person(id)?.name||'—');
const av=(id,cls='av')=>{const p=person(id);const n=id==='all'?'★':(p?.name||'?').trim().charAt(0);return `<span class="${cls}" style="background:${pColor(id)}">${esc(n)}</span>`};

/* ---------- nav ---------- */
const ICONS={
 today:'<path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',
 calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 routines:'<path d="M20 12a8 8 0 11-3-6.2M20 4v5h-5"/>',
 jobs:'<path d="M5 12l5 5L20 7"/>',
 meals:'<path d="M12 3l8 9-8 9-8-9z"/>',
 lists:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
 rewards:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'};
const VIEWS=[['today','היום'],['calendar','לוח שנה'],['routines','שגרות'],['jobs','מטלות'],['meals','ארוחות'],['lists','רשימות'],['rewards','כוכבים']];
let cur=location.hash.slice(1)||'today'; if(!VIEWS.some(v=>v[0]===cur))cur='today';
const ic=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;
function renderNav(){
  const b=VIEWS.map(([k,l])=>`<button class="${k===cur?'on':''}" onclick="go('${k}')">${ic(k)}<span>${l}</span></button>`).join('');
  document.getElementById('nav').innerHTML='<div class="lbl">בית</div>'+b;
  document.getElementById('mobNav').innerHTML=b;
  document.getElementById('sidePeople').innerHTML='<div class="lbl">מי גר כאן</div>'+S.people.map(p=>`<div class="person">${av(p.id)}<span>${esc(p.name)}</span></div>`).join('');
  document.getElementById('topDots').innerHTML=S.people.map(p=>av(p.id)).join('');
  document.getElementById('brandName').textContent=S.family;
  document.title=S.family;
}
function go(v){cur=v;location.hash=v;render();window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==cur&&VIEWS.some(v=>v[0]===h)){cur=h;render()}});
function render(){renderNav();document.getElementById('view').innerHTML=V[cur]();if(cur==='today')tick()}

/* ---------- data helpers ---------- */
function eventsOn(d){
  const k=dkey(d),wd=d.getDay();
  return S.events.filter(e=>{
    if(e.date===k)return true;
    if(e.date>k)return false;
    if((e.skip||[]).includes(k))return false;
    if(e.repeat==='daily')return true;
    if(e.repeat==='weekdays')return wd>=0&&wd<=4;
    if(e.repeat==='weekly')return parse(e.date).getDay()===wd;
    return false;
  }).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
}
function jobsOn(d){
  const wd=d.getDay(),k=dkey(d);
  return S.jobs.filter(j=>j.freq==='daily'||(j.freq==='weekly'&&+j.day===wd)||(j.freq==='once'&&(!j.doneOn||j.doneOn===k)));
}
const jobIsDone=(j,k)=>j.freq==='once'?!!j.doneOn:!!(S.jobDone[k]||{})[j.id];
function award(pid,n,why){const p=person(pid);if(!p||!n)return;p.stars=Math.max(0,(p.stars||0)+n);if(n>0)toast(`⭐ ${p.name} קיבל/ה ${n} ${n>1?'כוכבים':'כוכב'}! ${why||''}`)}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}
function greet(){const h=new Date().getHours();return h<5?'לילה טוב':h<12?'בוקר טוב':h<17?'צהריים טובים':h<21?'ערב טוב':'לילה טוב'}
function heDate(d){return d.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'})}

/* ---------- views ---------- */
const V={};
V.today=()=>{
  const d=new Date(),k=dkey(d),evs=eventsOn(d),jobs=jobsOn(d);
  const open=jobs.filter(j=>!jobIsDone(j,k));
  const kids=S.routines.map(r=>{const done=r.steps.filter((_,i)=>(S.routineDone[k]||{})[r.id+':'+i]).length;return {r,done}});
  return `
  <div class="head"><div><div class="eyebrow">${heDate(d)}</div><h2>${greet()}, ${esc(S.family)}</h2><p>כל מה שהבית צריך לדעת היום</p></div>
  <button class="btn" onclick="editEvent()">+ אירוע חדש</button></div>
  <div class="grid g2">
    <div class="card"><div class="eyebrow">הבא בתור</div><h3>הקצב של היום</h3>
      <div class="tl">${evs.length?evs.map(evRow).join(''):'<div class="empty">אין אירועים היום. יום רגוע 🌿</div>'}</div></div>
    <div class="grid" style="align-content:start">
      <div class="card hero"><div class="eyebrow">תמונת מצב משפחתית</div><div class="clock" id="clock">--:--</div>

        <div class="row">${S.people.map(p=>`<span class="pill">${av(p.id,'av" style="width:22px;height:22px;border-radius:7px;font-size:11px;background:'+p.color)}${esc(p.name)} · ⭐${p.stars||0}</span>`).join('')}</div></div>
      <div class="card"><div class="eyebrow">שגרות</div><h3>מה מחכה לילדים</h3>
        ${kids.length?kids.map(({r,done})=>`<div class="rt-h" style="cursor:pointer" onclick="go('routines')">${av(r.member)}<div style="flex:1"><div>${esc(pName(r.member))} · ${esc(r.name)}</div><div class="prog"><i style="width:${done/r.steps.length*100}%"></i></div></div><span class="muted" style="font-size:14px">${done}/${r.steps.length}</span></div>`).join(''):'<div class="empty">עוד לא הוגדרו שגרות</div>'}</div>
    </div>
  </div>
  <div class="grid g3" style="margin-top:18px">
    <div class="card"><div class="eyebrow">אחריות משותפת</div><h3>מטלות להיום</h3>
      ${jobs.length?jobs.map(j=>jobRow(j,k)).join(''):'<div class="empty">אין מטלות להיום</div>'}</div>
    ${S.lists[0]?`<div class="card"><div class="eyebrow">לזכור ביחד</div><h3>${esc(S.lists[0].name)}</h3>
      ${S.lists[0].items.filter(i=>!i.d).slice(0,6).map(i=>`<button class="chk" onclick="toggleItem('${S.lists[0].id}','${i.id}')"><span class="box"></span><span class="txt">${esc(i.t)}</span></button>`).join('')||'<div class="empty">הרשימה ריקה</div>'}
      ${addBox('quick','להוסיף לרשימה…',`addItem('${S.lists[0].id}',this)`)}</div>`:''}
  </div>`;
};
function evRow(e){
  return `<div class="ev click" onclick="editEvent('${e.id}')"><span class="t">${e.time||'כל היום'}</span><span class="bar" style="background:${pColor(e.member)}"></span>
  <div><div class="k">${esc(e.cat||'')}</div><div class="n">${esc(e.title)}</div><div class="muted" style="font-size:13px">${esc(pName(e.member))}</div></div>${av(e.member)}</div>`;

function jobRow(j,k){

const freqLabel=j=>j.freq==='daily'?'כל יום':j.freq==='weekly'?`כל יום ${DAYS[j.day]}`:'פעם אחת';
const addBox=(id,ph,fn)=>`<form class="add" onsubmit="event.preventDefault();${fn.replace('this','this.q')}"><input class="in" name="q" placeholder="${ph}" autocomplete="off"><button class="btn">+</button></form>`;

/* calendar */
let calDay=dkey(new Date()),calFilter='all';
V.calendar=()=>{
  const sel=parse(calDay),start=addDays(sel,-sel.getDay()),today=dkey(new Date());
  const days=[...Array(7)].map((_,i)=>addDays(start,i));
  const evs=eventsOn(sel).filter(e=>calFilter==='all'||e.member===calFilter||e.member==='all');
  return `<div class="head"><div><div class="eyebrow">לוח צבעוני משותף</div><h2>לוח המשפחה</h2><p>בית ספר, תורים, חוגים וכל מה שביניהם</p></div>
  <div class="navw"><button class="btn ghost" onclick="calMove(-7)">→</button><button class="btn ghost" onclick="calDay='${today}';render()">היום</button><button class="btn ghost" onclick="calMove(7)">←</button><button class="btn" onclick="editEvent(null,'${calDay}')">+ אירוע</button></div></div>
  <div class="week">${days.map(d=>{const k=dkey(d),e=eventsOn(d);return `<button class="day ${k===calDay?'on':''}" onclick="calDay='${k}';render()"><small>${DAYS_S[d.getDay()]}${k===today?' · היום':''}</small><b>${d.getDate()}</b><div class="pip">${[...new Set(e.map(x=>x.member))].slice(0,4).map(m=>`<i style="background:${k===calDay?'#fff':pColor(m)}"></i>`).join('')}</div></button>`}).join('')}</div>
  <div class="filters"><button class="f ${calFilter==='all'?'on':''}" onclick="calFilter='all';render()">כולם</button>${S.people.map(p=>`<button class="f ${calFilter===p.id?'on':''}" onclick="calFilter='${p.id}';render()"><i style="background:${p.color}"></i>${esc(p.name)}</button>`).join('')}</div>
  <div class="card"><h3>${heDate(sel)}</h3><div class="tl">${evs.length?evs.map(evRow).join(''):'<div class="empty">אין אירועים ביום הזה</div>'}</div></div>`;
};
function calMove(n){calDay=dkey(addDays(parse(calDay),n));render()}

/* routines */

  <div class="grid g3">${S.routines.map(r=>{
    const done=r.steps.filter((_,i)=>(S.routineDone[k]||{})[r.id+':'+i]).length,st=S.streaks[r.id]?.n||0;
    return `<div class="card"><div class="rt-h">${av(r.member)}<div><div class="muted" style="font-size:13px">${esc(pName(r.member))}</div><h3 style="margin:0">${esc(r.name)}</h3></div>${st?`<span class="streak">🔥 ${st} ימים</span>`:''}</div>
    <div class="prog"><i style="width:${done/r.steps.length*100}%;background:${pColor(r.member)}"></i></div><div class="muted" style="font-size:13px;margin-bottom:6px">${done} מתוך ${r.steps.length} הושלמו</div>
    ${r.steps.map((s,i)=>{const d=(S.routineDone[k]||{})[r.id+':'+i];return `<button class="chk ${d?'done':''}" onclick="toggleStep('${r.id}',${i})"><span class="box">${d?'✓':''}</span><span class="txt">${esc(s)}</span></button>`}).join('')}
    <div style="margin-top:10px"><button class="btn ghost" onclick="editRoutine('${r.id}')">עריכה</button></div></div>`}).join('')||'<div class="empty">עוד אין שגרות. הוסיפו את הראשונה!</div>'}</div>`;

/* jobs */
V.jobs=()=>{
  const k=dkey(new Date()),today=jobsOn(new Date());
  return `<div class="head"><div><div class="eyebrow">אחריות משותפת</div><h2>מטלות הבית</h2><p>מטלות קבועות לכל אחד, עם כוכבים על כל מה שמושלם</p></div><button class="btn" onclick="editJob()">+ מטלה</button></div>
  <div class="grid g2"><div class="card"><h3>לעשות היום <span class="muted" style="font-size:16px">(${today.filter(j=>!jobIsDone(j,k)).length})</span></h3>${today.map(j=>jobRow(j,k)).join('')||'<div class="empty">אין מטלות להיום</div>'}</div>
  <div class="card"><h3>כל המטלות</h3>${S.jobs.map(j=>`<div class="chk" style="cursor:pointer" onclick="editJob('${j.id}')">${av(j.member)}<span class="txt">${esc(j.title)}<div class="sub">${esc(pName(j.member))} · ${freqLabel(j)}${j.stars?` · ⭐${j.stars}`:''}</div></span><span class="muted">✎</span></div>`).join('')||'<div class="empty">אין מטלות</div>'}</div></div>`;
};

/* meals */
V.meals=()=>{

  return `<div class="head"><div><div class="eyebrow">מה אוכלים</div><h2>תפריט שבועי</h2><p>ארוחות ערב לשבוע, כדי שלא נצטרך לשאול כל יום "מה יש לאכול?"</p></div><button class="btn ghost" onclick="if(confirm('לנקות את כל התפריט?')){S.meals={};save();render()}">ניקוי שבוע</button></div>
  <div class="card">${DAYS.map((n,i)=>`<div class="meal ${i===wd?'today':''}"><b>${n}${i===wd?' · היום':''}</b><input value="${esc(S.meals[i]||'')}" placeholder="מה מבשלים?" onchange="S.meals[${i}]=this.value;save()"></div>`).join('')}</div>`;
};

/* lists */
V.lists=()=>`<div class="head"><div><div class="eyebrow">לזכור ביחד</div><h2>רשימות משפחתיות</h2><p>קניות, אריזה לטיול, וכל הדברים הקטנים שאסור לשכוח</p></div><button class="btn" onclick="newList()">+ רשימה</button></div>
  <div class="grid g3">${S.lists.map(l=>`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3>${esc(l.name)}</h3><button class="x" title="מחיקת רשימה" onclick="delList('${l.id}')">🗑</button></div>
  ${l.items.map(i=>`<div class="chk ${i.d?'done':''}"><button class="box" onclick="toggleItem('${l.id}','${i.id}')">${i.d?'✓':''}</button><span class="txt" onclick="toggleItem('${l.id}','${i.id}')" style="cursor:pointer">${esc(i.t)}</span><button class="x" onclick="delItem('${l.id}','${i.id}')">×</button></div>`).join('')||'<div class="empty">ריק</div>'}
  ${addBox('','להוסיף פריט…',`addItem('${l.id}',this)`)}
  ${l.items.some(i=>i.d)?`<button class="btn ghost" style="margin-top:10px;font-size:14px" onclick="clearDone('${l.id}')">ניקוי פריטים שסומנו</button>`:''}</div>`).join('')}</div>`;

/* rewards */
V.rewards=()=>{
  const total=S.people.reduce((a,p)=>a+(p.stars||0),0);
  return `<div class="head"><div><div class="eyebrow">חוגגים את ההתמדה</div><h2>כוכבים ופרסים</h2><p>רואים את ההתקדמות בלי להפוך את הבית לתחרות</p></div><button class="btn" onclick="editReward()">+ פרס</button></div>
  <div class="grid g2"><div class="grid" style="align-content:start">
    <div class="card hero"><div class="eyebrow">כוכבי הבית</div><div class="stars"><span class="big star">★</span><span class="big">${total}</span></div><div style="opacity:.85">נצברו ממטלות ושגרות שהושלמו</div></div>
    <div class="grid g3">${S.people.map(p=>`<div class="card"><div class="rt-h">${av(p.id)}<h3 style="margin:0">${esc(p.name)}</h3><span style="margin-inline-start:auto;font-size:22px;font-weight:700"><span class="star">★</span> ${p.stars||0}</span></div>

    <div class="card"><h3>חנות הפרסים</h3>${S.rewards.map(r=>`<div class="reward"><span style="font-size:22px">🎁</span><span style="cursor:pointer" onclick="editReward('${r.id}')">${esc(r.name)}</span><span class="cost"><span class="star">★</span>${r.cost}</span><button class="btn" style="padding:8px 12px" onclick="redeem('${r.id}')">מימוש</button></div>`).join('')||'<div class="empty">הוסיפו פרסים שאפשר להחליף בכוכבים</div>'}
    ${S.log.length?`<div class="eyebrow" style="margin-top:18px">מימושים אחרונים</div>${S.log.slice(-5).reverse().map(l=>`<div class="muted" style="font-size:14px;padding:4px 0">${esc(l)}</div>`).join('')}`:''}</div></div>`;

/* ---------- actions ---------- */
function toggleJob(id,k){
  const j=S.jobs.find(x=>x.id===id);if(!j)return;
  const was=jobIsDone(j,k);
  if(j.freq==='once')j.doneOn=was?null:k; else{S.jobDone[k]=S.jobDone[k]||{};S.jobDone[k][id]=!was}
  award(j.member,was?-(j.stars||0):(j.stars||0),was?'':`על "${j.title}"`);save();render();
}
function toggleStep(rid,i){
  const k=dkey(new Date()),r=S.routines.find(x=>x.id===rid);S.routineDone[k]=S.routineDone[k]||{};
  const key=rid+':'+i,before=r.steps.every((_,j)=>S.routineDone[k][rid+':'+j]);
  S.routineDone[k][key]=!S.routineDone[k][key];
  const after=r.steps.every((_,j)=>S.routineDone[k][rid+':'+j]);
  if(!before&&after){
    const y=dkey(addDays(new Date(),-1)),st=S.streaks[rid]||{n:0,last:null};
    if(st.last!==k){st.n=st.last===y?st.n+1:1;st.last=k}S.streaks[rid]=st;
    award(r.member,1,`על השלמת "${r.name}" 🎉`);
  }else if(before&&!after){award(r.member,-1)}
  save();render();
}
function addItem(lid,inp){const v=inp.value.trim();if(!v)return;S.lists.find(l=>l.id===lid).items.push({id:uid(),t:v,d:false});save();render();setTimeout(()=>{const f=[...document.querySelectorAll('form.add input')].find(x=>x.closest('.card')?.innerHTML.includes(lid));f&&f.focus()},0)}
function toggleItem(lid,iid){const i=S.lists.find(l=>l.id===lid).items.find(x=>x.id===iid);i.d=!i.d;save();render()}
function delItem(lid,iid){const l=S.lists.find(l=>l.id===lid);l.items=l.items.filter(x=>x.id!==iid);save();render()}
function clearDone(lid){const l=S.lists.find(l=>l.id===lid);l.items=l.items.filter(x=>!x.d);save();render()}
function newList(){const n=prompt('שם הרשימה:');if(n&&n.trim()){S.lists.push({id:uid(),name:n.trim(),items:[]});save();render()}}
function delList(id){if(confirm('למחוק את הרשימה?')){S.lists=S.lists.filter(l=>l.id!==id);save();render()}}
function redeem(id){
  const r=S.rewards.find(x=>x.id===id);
  modal(`<h3>מימוש: ${esc(r.name)}</h3><p class="muted">מי מממש? עולה ★${r.cost}</p><div class="seg">${S.people.map(p=>`<button ${p.stars>=r.cost?'':'disabled style="opacity:.4"'} onclick="doRedeem('${id}','${p.id}')">${av(p.id)} ${esc(p.name)} (★${p.stars||0})</button>`).join('')}</div><div class="actions"><span></span><button class="btn ghost" onclick="closeModal()">ביטול</button></div>`);
}
function doRedeem(rid,pid){const r=S.rewards.find(x=>x.id===rid),p=person(pid);if(p.stars<r.cost)return;p.stars-=r.cost;S.log.push(`${new Date().toLocaleDateString('he-IL')} · ${p.name} מימש/ה "${r.name}"`);save();closeModal();render();toast(`🎁 תהנה/י, ${p.name}!`)}

/* ---------- modals ---------- */
function modal(h){document.getElementById('sheet').innerHTML=h;document.getElementById('modal').classList.add('open');setTimeout(()=>document.querySelector('#sheet input')?.focus(),50)}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const memberSeg=(name,val,withAll)=>`<div class="seg" data-seg="${name}">${(withAll?[{id:'all',name:'כולם'}]:[]).concat(S.people).map(p=>`<button type="button" class="${p.id===val?'on':''}" data-v="${p.id}" onclick="segPick(this)">${av(p.id)} ${esc(p.name)}</button>`).join('')}</div>`;
function segPick(b){b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));b.parentNode.dispatchEvent(new Event('change'))}
const segVal=n=>document.querySelector(`[data-seg="${n}"] .on`)?.dataset.v;

function editEvent(id,date){
  const e=id?S.events.find(x=>x.id===id):{title:'',date:date||dkey(new Date()),time:'',member:'all',cat:'',repeat:'none'};
  modal(`<h3>${id?'עריכת אירוע':'אירוע חדש'}</h3><form class="form" onsubmit="event.preventDefault();saveEvent('${id||''}')">
  <label class="fl">מה?<input class="in" id="eT" required value="${esc(e.title)}" placeholder="תור לרופא שיניים"></label>
  <div class="two"><label class="fl">תאריך<input class="in" type="date" id="eD" value="${e.date}" required></label><label class="fl">שעה<input class="in" type="time" id="eH" value="${e.time||''}"></label></div>
  <label class="fl">סוג<input class="in" id="eC" value="${esc(e.cat||'')}" placeholder="בית ספר / חוג / תור / משפחה" list="cats"><datalist id="cats"><option>בית ספר</option><option>חוג</option><option>תור</option><option>משפחה</option><option>עבודה</option><option>יום הולדת</option></datalist></label>
  <label class="fl">של מי?</label>${memberSeg('m',e.member,true)}
  <label class="fl">חוזר?</label><div class="seg" data-seg="r">${[['none','לא'],['daily','כל יום'],['weekdays','א׳–ה׳'],['weekly','כל שבוע']].map(([v,l])=>`<button type="button" class="${e.repeat===v?'on':''}" data-v="${v}" onclick="segPick(this)">${l}</button>`).join('')}</div>
  <div class="actions">${id?`<button type="button" class="btn danger" onclick="delEvent('${id}')">מחיקה</button>`:''}<div class="r"><button type="button" class="btn ghost" onclick="closeModal()">ביטול</button><button class="btn">שמירה</button></div></div></form>`);
}
function saveEvent(id){
  const o={title:eT.value.trim(),date:eD.value,time:eH.value,cat:eC.value.trim(),member:segVal('m')||'all',repeat:segVal('r')||'none'};
  if(!o.title)return;
  if(id)Object.assign(S.events.find(x=>x.id===id),o);else S.events.push({id:uid(),...o});
  save();closeModal();render();
}
function delEvent(id){
  const e=S.events.find(x=>x.id===id);
  if(e.repeat!=='none'&&cur==='calendar'&&calDay!==e.date&&confirm('אירוע חוזר. למחוק רק את המופע של היום הנבחר? (ביטול = מחיקת כל הסדרה)')){(e.skip=e.skip||[]).push(calDay)}
  else S.events=S.events.filter(x=>x.id!==id);
  save();closeModal();render();
}
function editJob(id){
  const j=id?S.jobs.find(x=>x.id===id):{title:'',member:S.people[0]?.id,freq:'daily',day:new Date().getDay(),stars:1};
  modal(`<h3>${id?'עריכת מטלה':'מטלה חדשה'}</h3><form class="form" onsubmit="event.preventDefault();saveJob('${id||''}')">
  <label class="fl">המטלה<input class="in" id="jT" required value="${esc(j.title)}" placeholder="לפנות את המדיח"></label>
  <label class="fl">של מי?</label>${memberSeg('m',j.member)}
  <label class="fl">כל כמה זמן?</label><div class="seg" data-seg="f">${[['daily','כל יום'],['weekly','פעם בשבוע'],['once','פעם אחת']].map(([v,l])=>`<button type="button" class="${j.freq===v?'on':''}" data-v="${v}" onclick="segPick(this)">${l}</button>`).join('')}</div>
  <label class="fl">באיזה יום (למטלה שבועית)</label><div class="seg" data-seg="d">${DAYS.map((n,i)=>`<button type="button" class="${+j.day===i?'on':''}" data-v="${i}" onclick="segPick(this)">${n}</button>`).join('')}</div>
  <label class="fl">כמה כוכבים?<input class="in" type="number" min="0" max="20" id="jS" value="${j.stars||0}"></label>
  <div class="actions">${id?`<button type="button" class="btn danger" onclick="S.jobs=S.jobs.filter(x=>x.id!=='${id}');save();closeModal();render()">מחיקה</button>`:''}<div class="r"><button type="button" class="btn ghost" onclick="closeModal()">ביטול</button><button class="btn">שמירה</button></div></div></form>`);
}
function saveJob(id){
  const o={title:jT.value.trim(),member:segVal('m'),freq:segVal('f')||'daily',day:+(segVal('d')||0),stars:+jS.value||0};
  if(!o.title||!o.member)return;
  if(id)Object.assign(S.jobs.find(x=>x.id===id),o);else S.jobs.push({id:uid(),...o});
  save();closeModal();render();
}
function editRoutine(id){
  const r=id?S.routines.find(x=>x.id===id):{name:'',member:(S.people.find(p=>p.kid)||S.people[0])?.id,steps:[]};
  modal(`<h3>${id?'עריכת שגרה':'שגרה חדשה'}</h3><form class="form" onsubmit="event.preventDefault();saveRoutine('${id||''}')">
  <label class="fl">שם השגרה<input class="in" id="rN" required value="${esc(r.name)}" placeholder="בוקר לבית הספר"></label>
  <label class="fl">של מי?</label>${memberSeg('m',r.member)}
  <label class="fl">שלבים (שלב בכל שורה)<textarea class="in" id="rS" rows="6" placeholder="להתלבש&#10;ארוחת בוקר&#10;לצחצח שיניים">${esc(r.steps.join('\n'))}</textarea></label>
  <div class="actions">${id?`<button type="button" class="btn danger" onclick="S.routines=S.routines.filter(x=>x.id!=='${id}');save();closeModal();render()">מחיקה</button>`:''}<div class="r"><button type="button" class="btn ghost" onclick="closeModal()">ביטול</button><button class="btn">שמירה</button></div></div></form>`);
}
function saveRoutine(id){
  const o={name:rN.value.trim(),member:segVal('m'),steps:rS.value.split('\n').map(s=>s.trim()).filter(Boolean)};
  if(!o.name||!o.steps.length)return;
  if(id)Object.assign(S.routines.find(x=>x.id===id),o);else S.routines.push({id:uid(),...o});
  save();closeModal();render();
}
function editReward(id){
  const r=id?S.rewards.find(x=>x.id===id):{name:'',cost:10};
  modal(`<h3>${id?'עריכת פרס':'פרס חדש'}</h3><form class="form" onsubmit="event.preventDefault();saveReward('${id||''}')">
  <label class="fl">הפרס<input class="in" id="wN" required value="${esc(r.name)}" placeholder="לילה עם חבר"></label>
  <label class="fl">מחיר בכוכבים<input class="in" type="number" min="1" id="wC" value="${r.cost}"></label>
  <div class="actions">${id?`<button type="button" class="btn danger" onclick="S.rewards=S.rewards.filter(x=>x.id!=='${id}');save();closeModal();render()">מחיקה</button>`:''}<div class="r"><button type="button" class="btn ghost" onclick="closeModal()">ביטול</button><button class="btn">שמירה</button></div></div></form>`);
}
function saveReward(id){const o={name:wN.value.trim(),cost:Math.max(1,+wC.value||1)};if(!o.name)return;if(id)Object.assign(S.rewards.find(x=>x.id===id),o);else S.rewards.push({id:uid(),...o});save();closeModal();render()}

/* settings */
let draft;
function openSettings(){draft=JSON.parse(JSON.stringify({family:S.family,city:S.city,people:S.people}));drawSettings()}
function drawSettings(){
  modal(`<div class="eyebrow">הגדרות הבית</div><h3>מי גר כאן</h3>
  <label class="fl" style="margin-bottom:14px">שם הבית<input class="in" value="${esc(draft.family)}" oninput="draft.family=this.value"></label>
  ${draft.people.map((p,i)=>`<div class="mrow"><span class="av" style="background:${p.color}">${esc((p.name||'?').trim().charAt(0)||'?')}</span><input class="in" value="${esc(p.name)}" oninput="draft.people[${i}].name=this.value" placeholder="שם">
  <label style="font-size:13px;display:flex;gap:4px;align-items:center"><input type="checkbox" ${p.kid?'checked':''} onchange="draft.people[${i}].kid=this.checked">ילד/ה</label>
  <button class="x" onclick="if(confirm('להסיר?')){draft.people.splice(${i},1);drawSettings()}">×</button></div>
  <div class="colors" style="margin:-2px 40px 12px 0">${COLORS.map(c=>`<button style="background:${c}" class="${c===p.color?'on':''}" onclick="draft.people[${i}].color='${c}';drawSettings()"></button>`).join('')}</div>`).join('')}
  <button class="btn ghost" onclick="draft.people.push({id:uid(),name:'',color:COLORS[draft.people.length%COLORS.length],kid:true,stars:0});drawSettings()">+ בן/בת משפחה</button>
  <label class="fl" style="margin-top:16px">עיר (למזג האוויר)<div class="add" style="margin:0"><input class="in" id="cityQ" value="${esc(draft.city.name)}"><button class="btn ghost" onclick="findCity()">חיפוש</button></div><span id="cityMsg" style="font-size:13px"></span></label>
  <div class="eyebrow" style="margin-top:18px">גיבוי</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" onclick="exportData()">⬇ ייצוא גיבוי</button><label class="btn ghost">⬆ ייבוא גיבוי<input type="file" accept=".json" hidden onchange="importData(this)"></label><button class="btn danger" onclick="if(confirm('למחוק הכל ולהתחיל מחדש?')){localStorage.removeItem(KEY);location.reload()}">איפוס</button></div>
  <div class="actions"><span></span><div class="r"><button class="btn ghost" onclick="closeModal()">ביטול</button><button class="btn" onclick="saveSettings()">שמירה</button></div></div>`);
}
async function findCity(){
  const q=cityQ.value.trim(),m=document.getElementById('cityMsg');if(!q)return;m.textContent='מחפש…';
  try{const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?count=1&language=he&name=${encodeURIComponent(q)}`).then(r=>r.json());
    const c=r.results?.[0];if(!c){m.textContent='לא נמצאה עיר';return}
    draft.city={name:c.name,lat:c.latitude,lon:c.longitude};m.textContent=`✓ ${c.name}, ${c.country||''}`;
  }catch(e){m.textContent='אין חיבור לשירות מזג האוויר'}
}
function saveSettings(){
  draft.people=draft.people.filter(p=>p.name.trim());if(!draft.people.length)return alert('צריך לפחות בן משפחה אחד');
  const cityChanged=draft.city.name!==S.city.name;
  Object.assign(S,draft);save();closeModal();render();if(cityChanged)loadWeather();
}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download=`family-backup-${dkey(new Date())}.json`;a.click()}
function importData(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.people)throw 0;S=d;save();closeModal();render();toast('הגיבוי נטען ✓')}catch(e){alert('קובץ לא תקין')}})}

/* ---------- clock & weather ---------- */
function tick(){const c=document.getElementById('clock');if(c){const d=new Date();c.textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}`}}
setInterval(tick,10000);
const WMO=c=>c===0?'☀️':c<=2?'🌤️':c===3?'☁️':c<=48?'🌫️':c<=67?'🌧️':c<=77?'❄️':c<=82?'🌦️':'⛈️';
async function loadWeather(){
  const w=document.getElementById('weather');
  try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${S.city.lat}&longitude=${S.city.lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`).then(r=>r.json());
    w.innerHTML=`${WMO(r.current.weather_code)} <b>${Math.round(r.current.temperature_2m)}°</b> <span class="muted">${esc(S.city.name)} · ${Math.round(r.daily.temperature_2m_min[0])}°–${Math.round(r.daily.temperature_2m_max[0])}°</span>`;
  }catch(e){w.innerHTML=`🌡️ <span class="muted">${esc(S.city.name)}</span>`}
}
loadWeather();setInterval(loadWeather,30*60*1000);
/* refresh at midnight so routines/jobs reset */
let lastDay=dkey(new Date());setInterval(()=>{const k=dkey(new Date());if(k!==lastDay){lastDay=k;calDay=k;render()}},60000);
/* prune old done-maps (keep 60 days) */
(()=>{const lim=dkey(addDays(new Date(),-60));for(const m of [S.routineDone,S.jobDone])for(const k in m)if(k<lim)delete m[k];save()})();
render();
</script>
</body>
</html>
